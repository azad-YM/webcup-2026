services:
    _defaults:
        autowire: true
        autoconfigure: true

    # Ports internes d'IAM.
    IAM\Application\Ports\Provider\MemberAccountProvisioner:
        alias: IAM\Infrastructure\Service\IAMMemberAccountProvisioner

    IAM\Application\Ports\Provider\CurrentAccountProvider:
        alias: IAM\Infrastructure\Service\IAMCurrentAccountProvider

    # Port intermodule : port du consommateur (Example) -> adaptateur dans l'infrastructure du fournisseur (IAM).
    Example\Application\Ports\Provider\ItemAccessPolicy:
        alias: IAM\Infrastructure\Adapter\Example\AdminItemAccessPolicy

    IAM\:
        resource: '../src/IAM/'
        exclude:
            - '../src/IAM/Tests/'

    Example\:
        resource: '../src/Example/'
        exclude:
            - '../src/Example/Tests/'

    Shared\:
        resource: '../src/Shared/'
        exclude:
            - '../src/Shared/**/Tests/'
            - '../src/Shared/Infrastructure/Kernel.php'

    IAM\Application\Ports\Repository\IUserRepository:
        alias: IAM\Infrastructure\Doctrine\Repository\DoctrineUserRepository

    Example\Application\Ports\Repository\ItemRepository:
        alias: Example\Infrastructure\Doctrine\Repository\DoctrineItemRepository

    Shared\Infrastructure\Doctrine\Repository\SqlRoleRepository:
        arguments:
            $permissionsRepository: !tagged_iterator iam.access_permissions

    IAM\Infrastructure\InMemory\InMemoryAdminPermissionRepository:
        tags: ['iam.access_permissions']

    IAM\Application\Command\CreateRole\CreateRoleHandler:
        arguments:
            $permissionRepository: '@IAM\Infrastructure\InMemory\InMemoryAdminPermissionRepository'

    IAM\Application\Query\ListPermissions\ListPermissionsHandler:
        arguments:
            $permissions: '@IAM\Infrastructure\InMemory\InMemoryAdminPermissionRepository'

    IAM\Application\Query\ListMySpaces\ListMySpacesHandler:
        arguments:
            $providers: !tagged_iterator iam.accessible_spaces

    IAM\Infrastructure\Service\AdminAccessibleSpacesProvider:
        tags: ['iam.accessible_spaces']

    Symfony\Component\Messenger\MessageBusInterface $commandBus: '@command.bus'
    Symfony\Component\Messenger\MessageBusInterface $queryBus: '@query.bus'
    Symfony\Component\Messenger\MessageBusInterface $eventBus: '@event.bus'

    Shared\Application\Listener\ExceptionListener:
        tags:
            - { name: kernel.event_listener, event: kernel.exception, method: __invoke }

    Shared\Infrastructure\Service\BootstrapAdminService:
        arguments:
            $permissions: '@IAM\Infrastructure\InMemory\InMemoryAdminPermissionRepository'

    IAM\Application\Service\PortalAccessPolicy:
        arguments:
            $providers: !tagged_iterator iam.accessible_spaces
