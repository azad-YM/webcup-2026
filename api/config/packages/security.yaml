security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'
    providers:
        app_user_provider:
            entity:
                class: IAM\Domain\Entity\User
                property: email
    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false
        login_check:
            pattern: ^/api/login_check
            stateless: true
            custom_authenticator: IAM\Infrastructure\Security\PasswordAuthenticator

        main:
            lazy: true
            pattern: ^/api
            stateless: true
            jwt: ~

    access_control:
        - { path: ^/api/administration/services$, roles: PUBLIC_ACCESS, methods: [GET] }
        - { path: ^/api/communication/(publications|alerts)$, roles: PUBLIC_ACCESS, methods: [GET] }
        - { path: ^/api/iam/portal-sessions$, roles: PUBLIC_ACCESS, methods: [POST] }
        - { path: ^/api/login_check, roles: PUBLIC_ACCESS }
        - { path: ^/api/citizen/register$, roles: PUBLIC_ACCESS, methods: [POST] }
        # Flux SSE : public pour les topics `public.*`, privé via un ticket vérifié par le contrôleur.
        - { path: ^/api/realtime/stream$, roles: PUBLIC_ACCESS, methods: [GET] }
        - { path: ^/api, roles: IS_AUTHENTICATED_FULLY }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
