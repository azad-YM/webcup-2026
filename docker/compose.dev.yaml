name: novaterra-dev

x-api-environment: &api-environment
  APP_ENV: dev
  APP_SECRET: dev-only-change-me
  DATABASE_URL: "mysql://novaterra:novaterra@db:3306/novaterra?serverVersion=8.4.0&charset=utf8mb4"
  MESSENGER_TRANSPORT_DSN: "doctrine://default?auto_setup=0"
  MAILER_DSN: "null://null"
  CORS_ALLOW_ORIGIN: "^https?://(localhost|127\\.0\\.0\\.1)(:[0-9]+)?$"
  JWT_SECRET_KEY: "%kernel.project_dir%/config/jwt/private.pem"
  JWT_PUBLIC_KEY: "%kernel.project_dir%/config/jwt/public.pem"
  JWT_PASSPHRASE: dev-only-change-me
  # Temps réel : changer de fournisseur = changer REALTIME_TRANSPORT (database | mercure | pusher | none).
  # `database` : buffer realtime_event + flux SSE de l'API, sans serveur supplémentaire.
  REALTIME_TRANSPORT: database

services:
  admin:
    container_name: novaterra-admin
    build:
      context: ../
      dockerfile: front/apps/admin/docker/Dockerfile.dev
    ports:
      - "5179:5173"
    volumes:
      - ../front:/app:delegated

      - /app/node_modules
      - /app/apps/admin/node_modules
      - /app/packages/shared-ui/node_modules
      - /app/packages/shared-utils/node_modules
      - /app/packages/shared-config/node_modules
    environment:
      NODE_ENV: development
      VITE_SITE_URL: http://localhost:5178
      VITE_API_BASE_URL: http://localhost:8083/api
      VITE_APP_ENV: dev
    restart: unless-stopped
    networks:
      - novaterra
    develop:
      watch:
        - action: sync
          path: ../front
          target: /app
          ignore:
            - node_modules/
            - apps/admin/node_modules/
            - packages/shared-ui/node_modules/
            - packages/shared-utils/node_modules/
            - packages/shared-config/node_modules/

  site:
    container_name: novaterra-site
    build:
      context: ../
      dockerfile: front/apps/site/docker/Dockerfile.dev
    ports:
      - "5178:3000"
    volumes:
      - ../front:/app:delegated

      - /app/node_modules
      - /app/apps/site/node_modules
      - /app/packages/shared-ui/node_modules
      - /app/packages/shared-utils/node_modules
      - /app/packages/shared-config/node_modules
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8083/api
      NEXT_PUBLIC_SITE_URL: http://localhost:5178
      NEXT_PUBLIC_ADMIN_URL: http://localhost:5179
    restart: unless-stopped
    networks:
      - novaterra
    develop:
      watch:
        - action: sync
          path: ../front
          target: /app
          ignore:
            - node_modules/
            - apps/site/node_modules/
            - packages/shared-ui/node_modules/
            - packages/shared-utils/node_modules/
            - packages/shared-config/node_modules/

  api:
    container_name: novaterra-api
    restart: unless-stopped
    build:
      context: ../api
      dockerfile: docker/dev/Dockerfile.dev
    volumes:
      - ../api:/var/www/html
    depends_on:
      - db
    environment:
      <<: *api-environment
    networks:
      - novaterra
    develop:
      watch:
        - action: sync
          path: ../api
          target: /var/www/html
          ignore:
            - vendor/
            - var/

  messenger-worker:
    container_name: novaterra-messenger-worker
    restart: unless-stopped
    build:
      context: ../api
      dockerfile: docker/dev/Dockerfile.dev
    command:
      - php
      - bin/console
      - messenger:consume
      - async
      # Redémarre toutes les 5 min (restart: unless-stopped) pour reprendre le code PHP modifié.
      - --time-limit=300
      - -vv
    volumes:
      - ../api:/var/www/html
    depends_on:
      - db
    environment:
      <<: *api-environment
      SKIP_APP_SETUP: "1"
    networks:
      - novaterra

  db:
    image: mysql:8.4
    container_name: novaterra-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: novaterra
      MYSQL_USER: novaterra
      MYSQL_PASSWORD: novaterra
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - novaterra_db_data:/var/lib/mysql
    ports:
      - "3338:3306"
    networks:
      - novaterra

  nginx:
    image: nginx:1.25
    container_name: novaterra-api-nginx
    restart: unless-stopped
    volumes:
      - ../api:/var/www/html
      - ../api/docker/dev/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - api
    ports:
      - "8083:80"
    networks:
      - novaterra

volumes:
  novaterra_db_data:

networks:
  novaterra:
